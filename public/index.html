<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#121212">
<title>Portfolio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231a1a1a'/%3E%3Cpath d='M6 21l6-7 5 4 9-10' fill='none' stroke='%233ecf8e' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<aside>
  <div class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17l6-7 4 3.5L21 5"/></svg>PORTFOLIO</div>
  <nav id="nav" aria-label="Main">
    <a href="#overview" data-view="overview" class="active">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12l9-8 9 8"/><path d="M5.5 10.5V20h13v-9.5"/></svg><span>Overview</span></a>
    <a href="#assets" data-view="assets">
      <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="6.5" rx="7.5" ry="3"/><path d="M4.5 6.5v5.5c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3V6.5"/><path d="M4.5 12v5.5c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3V12"/></svg><span>Assets</span></a>
    <a href="#positions" data-view="positions">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M21 20H3"/></svg><span>Positions</span></a>
    <a href="#accounts" data-view="accounts">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10h18"/><path d="M16 14.5h2"/></svg><span>Accounts</span></a>
    <a href="#settings" data-view="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10"/><path d="M18 7h2"/><circle cx="16" cy="7" r="2"/><path d="M4 17h2"/><path d="M10 17h10"/><circle cx="8" cy="17" r="2"/></svg><span>Settings</span><i class="nav-dot" id="navDot" hidden></i></a>
  </nav>
  <div id="status" class="status" aria-live="polite"></div>
</aside>
<main>
  <header>
    <div class="head-main">
      <div class="total"><span id="total">$—</span></div>
      <div class="sub"><span id="chg"></span> <span class="dim">24h</span> <span id="pnl"></span></div>
    </div>
    <div class="right">
      <span id="live" class="live"><i></i><span id="liveText">connecting</span></span>
      <button id="refresh" type="button">Refresh now</button>
    </div>
  </header>
  <section id="view"></section>
</main>
<div id="drawer" class="drawer hidden"><div class="drawer-body" id="drawerBody" role="dialog" aria-modal="true" aria-label="Asset detail"></div></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<script src="/app.js" type="module"></script>
</body>
</html>
